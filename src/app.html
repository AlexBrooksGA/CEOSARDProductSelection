<!doctype html>
<html lang="en-AU">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="Discover, shortlist and compare CEOS-ARD assessed Earth observation data products." />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script nonce="%sveltekit.nonce%">
			(function () {
				try {
					var saved = JSON.parse(sessionStorage.getItem('ceos-ard-explorer') || 'null');
					var theme = saved && saved.theme;
					if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
